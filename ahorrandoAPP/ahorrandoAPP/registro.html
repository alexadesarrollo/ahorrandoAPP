<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" 
    crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./estilos.css">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark menu">
            <div class="container-fluid">
              <a class="navbar-brand" href="#">Navbar</a>
              <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#">Home</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Features</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Pricing</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link disabled" aria-disabled="true">Disabled</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
    </header>
    <main>
            <section class="container">
                <div class="row">
                    <div class="col-6">
                        <h1>Registrate</h1>
                        <form class="p-5 border rounded shadow">
                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <i class="bi bi-person-circle"></i>
                                </span>
                                <input type="text" class="form-control" placeholder="nombre completo">
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope-paper-heart"></i>
                                </span>
                                <input type="email" class="form-control" placeholder="correo electronico">
                            </div>
                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                   <i class="bi bi-file-lock"></i>
                            </span>
                            <input type="password" class="form-control" placeholder="contraseña">
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                   <i class="bi bi-calendar-heart"></i>
                            </span>
                            <input type="date" class="form-control" placeholder="fecha nacimiento">
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <i class="bi bi-person-hearts"></i>
                            </span>
                            <select class="form-select" aria-label="Default select example">
                                <option selected>Ocupacion</option>
                                <option value="1">estudiante</option>
                                <option value="2">empleado</option>
                                <option value="3">desempleado</option>
                              </select>
                             </div>

                             <div class="input-group mb-3">
                                <span class="input-group-text">
                                    <i class="bi bi-box2-heart"></i>
                            </span>
                            <div class="form-floating">
                                <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea"></textarea>
                                <label for="floatingTextarea">Comentarios</label>
                              </div>
                             </div>
                             <button class="btn btn-primary mb-3">enviar</button> 
                             <button class="btn btn-primary w-100 mb-3">enviar</button>
                             <button class="btn btn-outline-primary mb-3 ">enviar</button>
                             <button class="btn btn-outline-danger mb-3">enviar</button>
                             <button class="btn btn-outline-warning mb-3">enviar</button>
                             <button class="btn btn-outline-success mb-3">enviar</button>
                            </form>
                        </div>
                    </div>
                <div class="col-6"></div>

            </div>
        </section>
    </main>
    <footer></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

</body>
</html>
